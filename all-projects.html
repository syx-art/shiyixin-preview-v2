    function getLang() {
        let lang = localStorage.getItem('site-lang');
        if (!lang) {
            lang = (navigator.language || '').startsWith('zh') ? 'zh' : 'zh';
            localStorage.setItem('site-lang', lang);
        }
        return lang;
    }

    function setLang(lang) {
        localStorage.setItem('site-lang', lang);
        applyLanguage(lang);
    }

    function t(dict, key) {
        const lang = getLang();
        if (dict[key] && dict[key][lang]) return dict[key][lang];
        console.warn('i18n missing key:', key, 'lang:', lang);
        return key;
    }

    // Expose globally
    window.i18n = {
        getLang: getLang,
        setLang: setLang,
        t: function(key) { return t(I18N_STATIC, key); },
        tp: function(projectId, field) {
            const lang = getLang();
            if (I18N_PROJECTS[projectId] && I18N_PROJECTS[projectId][field] && I18N_PROJECTS[projectId][field][lang]) {
                return I18N_PROJECTS[projectId][field][lang];
            }
            console.warn('i18n project missing:', projectId, field, lang);
            return '';
        }
    };

    // Apply translations to data-i18n elements
    function applyLanguage(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (I18N_STATIC[key] && I18N_STATIC[key][lang]) {
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = I18N_STATIC[key][lang];
                } else if (el.tagName === 'SELECT') {
                    // Handle select options
                } else if (el.tagName === 'OPTION') {
                    el.textContent = I18N_STATIC[key][lang];
                } else {
                    el.textContent = I18N_STATIC[key][lang];
                }
            }
        });

        // Update language toggle button text
        const toggleBtns = document.querySelectorAll('#langToggle, #langToggleMobile');
        toggleBtns.forEach(btn => {
            btn.textContent = lang === 'zh' ? 'EN' : '中';
        });

        // Trigger custom event for JS-rendered content
        window.dispatchEvent(new CustomEvent('languageChanged', { detail: { lang: lang } }));
    }

    // Initial apply
    document.addEventListener('DOMContentLoaded', function() {
        applyLanguage(getLang());
    });

    // Also apply immediately if DOM already loaded
    if (document.readyState !== 'loading') {
        applyLanguage(getLang());
    }
})();

        // 渲染全部项目卡片

            if (!container) return;

            allProjects.forEach(proj => {
                const card = document.createElement('div');
                card.className = 'project-card group bg-black/40 border border-white/10 rounded-2xl overflow-hidden hover:border-white/30 transition duration-300 fade-up';
                card.innerHTML = `<img src="${proj.mainImage}" class="w-full h-52 object-cover transition duration-500" loading="lazy"><div class="p-4"><p class="text-gray-400 text-[11px] uppercase tracking-wider">${window.i18n.tp(proj.id, 'type')}</p><h3 class="text-lg font-light mt-1">${window.i18n.tp(proj.id, 'title')}</h3><p class="text-gray-400 text-xs mt-2 line-clamp-2">${window.i18n.tp(proj.id, 'shortDesc')}</p><div class="mt-3 text-xs border border-white/30 px-3 py-1.5 rounded-full inline-block hover:bg-white hover:text-black transition">查看详情</div></div>`;
                card.onclick = () => openProjectModal(proj);
                container.appendChild(card);
            });
        }

            });
        }

        function closeModal() {
            const modal = document.getElementById('projectModal');
            modal.classList.add('invisible', 'opacity-0');
            document.body.style.overflow = '';
        }

        // 全屏图片查看器（完整版：缩放+拖拽+左右切换）
        let currentGalleryImages = [], currentGalleryIndex = 0;
        const fullViewer = document.getElementById('imageViewer');
        const fullImg = document.getElementById('fullImg');
        window.openFullViewerWithGallery = function(images, startSrc) {
            currentGalleryImages = images;
            currentGalleryIndex = images.findIndex(i => i === startSrc);
            if (currentGalleryIndex === -1) currentGalleryIndex = 0;
            fullImg.src = currentGalleryImages[currentGalleryIndex];
            fullViewer.classList.add('active');
            document.body.style.overflow = 'hidden';
            setupDragZoom();
        };
        let scale = 1, translateX = 0, translateY = 0, isDraggingZoom = false, startX = 0, startY = 0;
        function setupDragZoom() {
            const img = fullImg;
            const viewerEl = fullViewer;
            const applyTransform = () => { img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; };

            // === Desktop: Mouse Wheel ===
            function onWheel(e) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = scale * delta;
                if (newScale > 4 || newScale < 0.5) return;
                const rect = img.getBoundingClientRect();
                const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
                const originX = mouseX / rect.width, originY = mouseY / rect.height;
                scale = newScale;
                const deltaX = (originX - 0.5) * rect.width * (1 - 1/delta);
                const deltaY = (originY - 0.5) * rect.height * (1 - 1/delta);
                translateX -= deltaX; translateY -= deltaY;
                applyTransform();
            }

            // === Desktop: Mouse Drag ===
            function onMouseDown(e) { isDraggingZoom = true; startX = e.clientX - translateX; startY = e.clientY - translateY; img.style.cursor = 'grabbing'; e.preventDefault(); }
            function onMouseMove(e) { if (!isDraggingZoom) return; translateX = e.clientX - startX; translateY = e.clientY - startY; applyTransform(); }
            function onMouseUp() { isDraggingZoom = false; img.style.cursor = 'grab'; }

            // === Mobile: Touch ===
            let pinchStartDist = 0, pinchStartScale = 1, panStartX = 0, panStartY = 0;
            let swipeStartX = 0, swipeStartY = 0, isSwiping = false;
            function getTouchDist(t1, t2) { return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY); }
            function onTouchStart(e) {
                if (e.touches.length === 2) { pinchStartDist = getTouchDist(e.touches[0], e.touches[1]); pinchStartScale = scale; isSwiping = false; }
                else if (e.touches.length === 1) {
                    if (scale > 1) { panStartX = e.touches[0].clientX - translateX; panStartY = e.touches[0].clientY - translateY; isSwiping = false; }
                    else { swipeStartX = e.touches[0].clientX; swipeStartY = e.touches[0].clientY; isSwiping = true; }
                }
            }
            function onTouchMove(e) {
                if (e.touches.length === 2) { e.preventDefault(); const dist = getTouchDist(e.touches[0], e.touches[1]); scale = Math.min(4, Math.max(0.5, pinchStartScale * (dist / pinchStartDist))); applyTransform(); }
                else if (e.touches.length === 1 && scale > 1) { translateX = e.touches[0].clientX - panStartX; translateY = e.touches[0].clientY - panStartY; applyTransform(); e.preventDefault(); }
            }
            function onTouchEnd(e) {
                if (isSwiping && scale === 1 && e.changedTouches.length) {
                    const dx = e.changedTouches[0].clientX - swipeStartX, dy = e.changedTouches[0].clientY - swipeStartY;
                    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) { if (dx > 0) prevFullImage(); else nextFullImage(); }
                }
                if (e.touches.length === 0) isSwiping = false;
            }

            // === ESC Key ===
            function onKeyDown(e) { if (e.key === 'Escape') closeImageViewer(); }

            img.addEventListener('wheel', onWheel, { passive: false });
            img.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('keydown', onKeyDown);
            img.style.cursor = 'grab';
            viewerEl.addEventListener('touchstart', onTouchStart, { passive: false });
            viewerEl.addEventListener('touchmove', onTouchMove, { passive: false });
            viewerEl.addEventListener('touchend', onTouchEnd);

            window.cleanupZoom = () => {
                img.removeEventListener('wheel', onWheel);
                img.removeEventListener('mousedown', onMouseDown);
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
                window.removeEventListener('keydown', onKeyDown);
                viewerEl.removeEventListener('touchstart', onTouchStart);
                viewerEl.removeEventListener('touchmove', onTouchMove);
                viewerEl.removeEventListener('touchend', onTouchEnd);
            };
        }
        function closeImageViewer() {
            fullViewer.classList.remove('active');
            document.body.style.overflow = '';
            if (window.cleanupZoom) window.cleanupZoom();
            scale = 1; translateX = 0; translateY = 0;
            fullImg.style.transform = '';
        }
        function nextFullImage() { if (currentGalleryImages.length) { currentGalleryIndex = (currentGalleryIndex + 1) % currentGalleryImages.length; fullImg.src = currentGalleryImages[currentGalleryIndex]; resetZoom(); } }
        function prevFullImage() { if (currentGalleryImages.length) { currentGalleryIndex = (currentGalleryIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length; fullImg.src = currentGalleryImages[currentGalleryIndex]; resetZoom(); } }
        function resetZoom() { scale = 1; translateX = 0; translateY = 0; fullImg.style.transform = 'translate(0px, 0px) scale(1)'; }
        document.getElementById('viewerPrev').onclick = () => nextFullImage();
        document.getElementById('viewerNext').onclick = () => prevFullImage();
        document.getElementById('viewerClose').onclick = closeImageViewer;
        fullViewer.onclick = (e) => { if (e.target === fullViewer) closeImageViewer(); };

        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('projectModal').addEventListener('click', (e) => { if (e.target === document.getElementById('projectModal')) closeModal(); });
        renderAllProjects();

    // ===== Language change handler for all-projects.html =====
    window.addEventListener('languageChanged', function(e) {
        // Re-render all project cards to update language
        const container = document.getElementById('allProjectsGrid');
        // Store current scroll position
        const scrollY = window.scrollY;
        renderAllProjects();
        // Restore scroll position
        window.scrollTo(0, scrollY);
        
        // Re-observe fade-up elements
        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    });
    

        const fadeElements = document.querySelectorAll('.fade-up');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        fadeElements.forEach(el => observer.observe(el));
    </script>
